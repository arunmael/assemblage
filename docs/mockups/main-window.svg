<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: #f4f4f5; stroke: #c9c9cc; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #d6d6d9; stroke-width: 1; }
    .toolbar-icon { fill: #ffffff; stroke: #b8b8bc; stroke-width: 1; }
    .layer-row { fill: #ffffff; stroke: #e2e2e5; stroke-width: 1; }
    .layer-row-selected { fill: #e8f0ff; stroke: #6ea8fe; stroke-width: 1.5; }
    .label { fill: #333336; font-size: 12px; }
    .label-muted { fill: #8a8a8e; font-size: 11px; }
    .section-title { fill: #6a6a6e; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; }
    .canvas-shape { fill: #cfe3ff; stroke: #6ea8fe; stroke-width: 1.5; }
    .canvas-shape-2 { fill: #ffd9a8; stroke: #f0a94e; stroke-width: 1.5; }
    .handle { fill: #ffffff; stroke: #6ea8fe; stroke-width: 1.5; }
  </style>

  <rect width="1200" height="760" class="frame"/>

  <!-- Titlebar -->
  <rect x="0" y="0" width="1200" height="28" fill="#e8e8ea" stroke="#d0d0d3"/>
  <circle cx="18" cy="14" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="14" r="6" fill="#febc2e"/>
  <circle cx="58" cy="14" r="6" fill="#28c840"/>
  <text x="600" y="18" text-anchor="middle" class="label" font-weight="600">Ohne Titel — Assemblage</text>

  <!-- Toolbar (kontextabhängig, max 7-8 Icons) -->
  <rect x="0" y="28" width="1200" height="52" fill="#fbfbfc" stroke="#e2e2e5"/>
  <g transform="translate(20,42)">
    <!-- Auswählen -->
    <rect class="toolbar-icon" x="0" y="0" width="34" height="24" rx="6"/>
    <text x="17" y="16" text-anchor="middle" class="label-muted">↖</text>
    <!-- Verschieben -->
    <rect class="toolbar-icon" x="44" y="0" width="34" height="24" rx="6"/>
    <text x="61" y="16" text-anchor="middle" class="label-muted">✥</text>
    <!-- Pinsel-Maske -->
    <rect class="toolbar-icon" x="88" y="0" width="34" height="24" rx="6"/>
    <text x="105" y="16" text-anchor="middle" class="label-muted">🖌</text>
    <!-- Freistellen -->
    <rect class="toolbar-icon" x="132" y="0" width="34" height="24" rx="6"/>
    <text x="149" y="16" text-anchor="middle" class="label-muted">✂</text>
    <!-- Text -->
    <rect class="toolbar-icon" x="176" y="0" width="34" height="24" rx="6"/>
    <text x="193" y="16" text-anchor="middle" class="label-muted">T</text>
    <!-- Formen -->
    <rect class="toolbar-icon" x="220" y="0" width="34" height="24" rx="6"/>
    <text x="237" y="16" text-anchor="middle" class="label-muted">▭</text>
    <!-- Zuschneiden -->
    <rect class="toolbar-icon" x="264" y="0" width="34" height="24" rx="6"/>
    <text x="281" y="16" text-anchor="middle" class="label-muted">⤢</text>
  </g>
  <text x="1180" y="58" text-anchor="end" class="label-muted">Export ⇩</text>

  <!-- Ebenenliste (links) -->
  <rect x="0" y="80" width="220" height="680" class="panel"/>
  <text x="16" y="102" class="section-title">Ebenen</text>
  <rect class="layer-row-selected" x="12" y="112" width="196" height="40" rx="6"/>
  <rect x="18" y="118" width="28" height="28" fill="#ffd9a8" stroke="#f0a94e"/>
  <text x="54" y="136" class="label">Titel</text>
  <text x="188" y="136" class="label-muted">👁</text>

  <rect class="layer-row" x="12" y="156" width="196" height="40" rx="6"/>
  <rect x="18" y="162" width="28" height="28" fill="#cfe3ff" stroke="#6ea8fe"/>
  <text x="54" y="180" class="label">Hintergrund-Foto</text>
  <text x="188" y="180" class="label-muted">👁</text>

  <rect class="layer-row" x="12" y="200" width="196" height="40" rx="6"/>
  <rect x="18" y="206" width="28" height="28" fill="#d7d7ff" stroke="#9a9aff"/>
  <text x="54" y="224" class="label">Rahmen</text>
  <text x="188" y="224" class="label-muted">👁</text>

  <!-- Canvas (Mitte) -->
  <rect x="220" y="80" width="700" height="680" fill="#eceef0"/>
  <rect x="380" y="180" width="380" height="480" fill="#ffffff" stroke="#c9c9cc" stroke-dasharray="4 3"/>

  <rect class="canvas-shape" x="420" y="240" width="220" height="220" rx="4"/>
  <rect class="canvas-shape-2" x="560" y="420" width="160" height="160" rx="80"/>

  <!-- Griffpunkte um ausgewählte Form -->
  <g>
    <rect class="handle" x="415" y="235" width="10" height="10"/>
    <rect class="handle" x="635" y="235" width="10" height="10"/>
    <rect class="handle" x="415" y="455" width="10" height="10"/>
    <rect class="handle" x="635" y="455" width="10" height="10"/>
    <rect class="handle" x="525" y="235" width="10" height="10"/>
    <rect class="handle" x="525" y="455" width="10" height="10"/>
    <rect class="handle" x="415" y="345" width="10" height="10"/>
    <rect class="handle" x="635" y="345" width="10" height="10"/>
  </g>
  <text x="570" y="660" text-anchor="middle" class="label-muted">Instagram-Post 1080×1080</text>

  <!-- Eigenschaften (rechts) -->
  <rect x="920" y="80" width="280" height="680" class="panel"/>
  <text x="936" y="102" class="section-title">Eigenschaften — Textebene</text>

  <text x="936" y="132" class="label-muted">Schrift</text>
  <rect class="layer-row" x="936" y="140" width="248" height="26" rx="4"/>
  <text x="944" y="157" class="label">Helvetica Neue Bold</text>

  <text x="936" y="184" class="label-muted">Grösse</text>
  <rect class="layer-row" x="936" y="192" width="248" height="26" rx="4"/>
  <text x="944" y="209" class="label">72 pt</text>

  <text x="936" y="236" class="label-muted">Farbe</text>
  <rect x="936" y="244" width="26" height="26" rx="4" fill="#222226" stroke="#c9c9cc"/>
  <rect class="layer-row" x="970" y="244" width="214" height="26" rx="4"/>
  <text x="978" y="261" class="label">#222226</text>

  <text x="936" y="296" class="label-muted">Ausrichtung</text>
  <rect class="toolbar-icon" x="936" y="304" width="30" height="24" rx="4"/>
  <rect class="toolbar-icon" x="970" y="304" width="30" height="24" rx="4"/>
  <rect class="toolbar-icon" x="1004" y="304" width="30" height="24" rx="4"/>

  <text x="936" y="356" class="label-muted">Deckkraft</text>
  <rect x="936" y="364" width="248" height="4" rx="2" fill="#d6d6d9"/>
  <circle cx="1140" cy="366" r="7" fill="#ffffff" stroke="#6ea8fe" stroke-width="1.5"/>

  <line x1="936" y1="400" x2="1184" y2="400" stroke="#e2e2e5"/>
  <text x="936" y="424" class="section-title">Position &amp; Grösse</text>
  <text x="936" y="450" class="label-muted">X: 340   Y: 120   B: 380   H: 96</text>
</svg>
