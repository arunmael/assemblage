name: Tests

# Zwei Jobs, entsprechend der Zweiteilung in Package.swift:
#
# • ubuntu — baut und testet nur das portable Datenmodell
#   (Sources/AssemblageModel), das bewusst ohne AppKit/Core Image/Vision
#   auskommt. Hält ehrlich, dass diese Trennung tatsächlich eingehalten wird:
#   Schleicht sich ein Apple-Import ins Modell, wird dieser Job rot.
#
# • macOS — baut zusätzlich die App (AssemblageKit) und führt die Tests der
#   Rendering-Pipeline aus (Kompositing, Dokumentpakete, später Maskierung
#   und Export), wie Plan 2.1 sie verlangt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-model:
    name: swift test (ubuntu, nur Modell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

  test-app:
    name: swift test (macOS, App + Pipeline)
    # Braucht ein Abbild mit dem macOS-26-SDK, weil Package.swift genau das
    # als Mindestversion setzt. Schlägt der Job mit „unknown deployment
    # target" fehl, muss hier ein neueres Abbild fest eingetragen werden
    # (z. B. macos-26) — `latest` hinkt bei GitHub oft eine Version hinterher.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

      # Prüft, dass das Bundle tatsächlich zusammengebaut werden kann —
      # ein Fehler in Info.plist oder Symbolerzeugung fällt sonst erst beim
      # Ausliefern auf.
      - name: App-Bundle bauen
        run: Scripts/make-app.sh release
